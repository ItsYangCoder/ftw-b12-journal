<svg xmlns="http://www.w3.org/2000/svg" width="920" height="290" viewBox="0 0 920 290" role="img" aria-labelledby="title desc"><title id="title">Pytest in the NYC Mobility pipeline</title><desc id="desc">A source data sample enters ingestion code, pytest checks expected behavior, and only passing changes move toward the pipeline.</desc><rect width="920" height="290" fill="#f6f8fa"/><text x="40" y="55" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#19324d">How pytest helps our pipeline</text><g font-family="Arial,sans-serif" font-size="18" text-anchor="middle"><rect x="38" y="102" width="214" height="108" rx="14" fill="#dceeff" stroke="#4386c6" stroke-width="2"/><text x="145" y="145" fill="#19324d">Sample source data</text><text x="145" y="176" font-size="15" fill="#39556c">known inputs</text><rect x="353" y="102" width="214" height="108" rx="14" fill="#e8e2ff" stroke="#7865ba" stroke-width="2"/><text x="460" y="145" fill="#33275d">Ingestion function</text><text x="460" y="176" font-size="15" fill="#51486c">behavior under test</text><rect x="668" y="102" width="214" height="108" rx="14" fill="#def4e5" stroke="#459965" stroke-width="2"/><text x="775" y="145" fill="#214b33">pytest assertions</text><text x="775" y="176" font-size="15" fill="#3e654b">expected output</text></g><g stroke="#526579" stroke-width="3" fill="none"><path d="M260 156h80"/><path d="M575 156h80"/></g><g fill="#526579"><path d="m340 156-12-8v16z"/><path d="m655 156-12-8v16z"/></g><text x="40" y="260" font-family="Arial,sans-serif" font-size="15" fill="#516273">Tests can flag regressions before a code change reaches later pipeline stages.</text></svg>